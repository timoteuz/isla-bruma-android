<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#142522">
<title>Isla Bruma — Supervivencia 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142522;color:#f6f2df;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:3;pointer-events:none;text-shadow:0 2px 4px #0009}.brand{top:env(safe-area-inset-top,8px);left:12px;font-weight:900;letter-spacing:2px;font-size:14px;color:#f2d18b}.sub{font-size:10px;letter-spacing:1.5px;color:#d5e0d4}.status{top:12px;right:12px;width:138px;background:#10201dc9;border:1px solid #ffffff26;border-radius:12px;padding:9px}.bar{height:7px;background:#453d37;border-radius:8px;margin:4px 0 7px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#a9d16b,#e4d780);border-radius:8px}.resources{left:12px;top:68px;display:flex;gap:6px;flex-wrap:wrap;max-width:58%}.pill{background:#10201dc9;border:1px solid #ffffff26;border-radius:9px;padding:6px 8px;font-size:11px}.hint{left:50%;top:53%;transform:translate(-50%,-50%);font-size:12px;color:#fff6d6;text-align:center;background:#10201d70;padding:6px 10px;border-radius:9px;opacity:0;transition:opacity .2s}.bottom{position:fixed;z-index:5;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}.joy{width:116px;height:116px;border-radius:50%;background:#dce9dc20;border:1px solid #ffffff65;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#e8f0df66;border:1px solid #fff9;box-shadow:0 3px 10px #0005}.actions{display:grid;grid-template-columns:repeat(2,54px);gap:9px;pointer-events:auto}.act{width:54px;height:54px;border-radius:50%;border:1px solid #fff8;background:#172b27d9;color:#fff;font-size:20px;box-shadow:0 4px 12px #0006;touch-action:manipulation}.act small{display:block;font-size:8px;letter-spacing:.3px}.act.primary{background:#b67a3bdf}.message{position:fixed;z-index:8;left:50%;top:20%;transform:translateX(-50%);background:#13221fed;border:1px solid #e4c48b;border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff9;z-index:2;pointer-events:none}@media(min-width:700px){.bottom{padding:0 28px}.joy{width:130px;height:130px}.knob{left:40px;top:40px}}
</style></head>
<body><div id="game"></div><div class="hud brand">ISLA BRUMA<div class="sub">SUPERVIVENCIA · DÍA 1</div></div><div class="hud status"><div>♥ VIDA <span id="hptext">100</span></div><div class="bar"><div class="fill" id="hpbar"></div></div><div>✦ ENERGÍA <span id="sttext">100</span></div><div class="bar"><div class="fill" id="stbar" style="background:linear-gradient(90deg,#69b7b3,#a4e4cb)"></div></div></div><div class="hud resources"><div class="pill">🪵 <span id="wood">0</span></div><div class="pill">🪨 <span id="stone">0</span></div><div class="pill">🫐 <span id="berry">0</span></div><div class="pill">🌿 <span id="fiber">0</span></div></div><div class="hud hint" id="hint">Explorá la isla</div><div class="crosshair"></div><div class="message" id="msg"></div><div class="bottom"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="act" id="gather">✋<small>RECOGER</small></button><button class="act primary" id="attack">⚔️<small>ATACAR</small></button><button class="act" id="heal">✚<small>CURAR</small></button><button class="act" id="build">⌂<small>REFUGIO</small></button></div></div><script src="game.js"></script></body></html>
