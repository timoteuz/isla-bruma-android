<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101d22">
  <title>Isla Bruma 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101d22;
      font-family: Arial, sans-serif;
      color: white;
      touch-action: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    #title {
      position: absolute;
      top: 12px;
      left: 12px;
      font-weight: bold;
      font-size: 19px;
      text-shadow: 0 2px 5px black;
    }
    #stats {
      position: absolute;
      top: 42px;
      left: 12px;
      padding: 8px 10px;
      background: #071115bb;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    #help {
      position: absolute;
      top: 12px;
      right: 10px;
      max-width: 48%;
      text-align: right;
      font-size: 11px;
      text-shadow: 0 2px 4px black;
    }
    #controls {
      position: absolute;
      inset: 0;
    }
    .btn {
      pointer-events: auto;
      position: absolute;
      border: 1px solid #ffffff88;
      border-radius: 50%;
      width: 62px;
      height: 62px;
      color: white;
      font-weight: bold;
      background: #172d36cc;
      font-size: 12px;
      touch-action: none;
    }
    #stick {
      position: absolute;
      pointer-events: auto;
      left: 22px;
      bottom: 26px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 2px solid #ffffff66;
      background: #07111566;
      touch-action: none;
    }
    #knob {
      position: absolute;
      width: 48px;
      height: 48px;
      left: 36px;
      top: 36px;
      border-radius: 50%;
      background: #c9e6e9cc;
      border: 2px solid white;
    }
    #attack { right: 22px; bottom: 30px; }
    #gather { right: 90px; bottom: 102px; }
    #heal { right: 20px; bottom: 174px; }
    #message {
      position: absolute;
      left: 50%;
      bottom: 165px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 8px;
      background: #071115bb;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">ISLA BRUMA 3D</div>
    <div id="stats">Vida: <span id="hp">100</span><br>Recursos: <span id="wood">0</span></div>
    <div id="help">Explora la isla<br>Muévete con el control<br>Reúne recursos y sobrevive</div>
    <div id="controls">
      <div id="stick"><div id="knob"></div></div>
      <button class="btn" id="attack">ATACAR</button>
      <button class="btn" id="gather">REUNIR</button>
      <button class="btn" id="heal">CURAR</button>
      <div id="message">La niebla oculta peligros...</div>
    </div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
